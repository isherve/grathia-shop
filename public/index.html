<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grathia Shop Manager</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
</head>
<body>
<div id="auth" hidden></div>

<div class="layout" id="shell" hidden>
  <aside id="side">
    <div class="brand"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#0e7c7b"/><path d="M9 22h22v9H9z" fill="#fff"/><path d="M11 22v-4h18v4" fill="#ffd27a"/><path d="M15 18v-4M20 18v-5M25 18v-4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <div><span id="shopname">Grathia Sweet Haven</span><small>Shop manager</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <div class="who"><div class="av" id="me-av"></div><div><b id="me-name"></b><small id="me-role"></small></div></div>
      <nav class="nav" id="nav2"></nav>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <div class="topbar">
      <button class="ib menu-btn" id="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="title">Dashboard</h1>
      <span class="sp"></span>
      <span class="hint" id="clock"></span>
      <button class="ib" id="theme" aria-label="Switch light or dark mode"></button>
    </div>
    <main id="page"></main>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>
<script src="app.js"></script>
</body>
</html>
